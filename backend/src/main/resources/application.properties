server.port=${PORT:8080}

# Spring Data MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/carequeue_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
carequeue.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENVIRONMENT}
carequeue.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
carequeue.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://localhost:5713}

# Admin Seed Configuration
carequeue.admin.name=${ADMIN_NAME:CareQueue Admin}
carequeue.admin.email=${ADMIN_EMAIL:admin@carequeue.com}
carequeue.admin.password=${ADMIN_PASSWORD:CHANGE_ME_IN_ENVIRONMENT}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.carequeue=INFO
logging.level.org.springframework.security=INFO
